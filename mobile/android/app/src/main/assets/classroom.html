<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>2.5D Teacher</title>
    <style>
        body,
        html {
            margin: 0;
            overflow: hidden;
            background-color: #f0f0f0;
            /* DEBUG: CACHE CHECK - If you see this, file updated */
        }

        #loader {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-family: sans-serif;
            font-weight: bold;
            background: rgba(255, 255, 255, 0.8);
            padding: 10px 20px;
            border-radius: 20px;
            z-index: 100;
        }
    </style>
    <!-- Import Three.js -->
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js"
            }
        }
    </script>
</head>

<body>
    <div id="loader">Loading Teacher...</div>
    <script type="module">
        import * as THREE from 'three';

        // --- Config ---
        // --- Config ---
        const BACKGROUND_IMAGE = './classroom_bg.jpg';
        const TEACHER_TALKING = './teacher_talking.mp4';
        const TEACHER_IDLE = './teacher_idle.mp4';
        const BACKGROUND_MUSIC = './classroom_music.mp3';

        let scene, camera, renderer;
        let teacherMesh, backgroundMesh, uniforms;
        let textures = {};

        // Video State
        let videoTalking, videoIdle;
        let textureTalking, textureIdle;

        // Audio State
        let bgMusic;

        const clock = new THREE.Clock(); // Keep clock declared once

        let isTalking = false;

        // Movement State
        let targetPosition = new THREE.Vector3(0, 0.1, 0);
        const WALK_SPEED = 3.5; // Much faster responsiveness
        const BOARD_X = -0.6;
        const CENTER_X = 0.0;

        // ... (Viseme vars removed as unused) ...

        init();
        animate();

        function init() {
            scene = new THREE.Scene();

            // Camera setup
            camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 100);
            camera.position.set(0, 0.0, 4.0);

            renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(window.devicePixelRatio);
            document.body.appendChild(renderer.domElement);

            createBackground();

            // --- SETUP VIDEOS ---
            videoTalking = createVideoElement(TEACHER_TALKING, true); 
            videoIdle = createVideoElement(TEACHER_IDLE, true); 

            // --- SETUP TEXTURES ---
            textureTalking = createVideoTexture(videoTalking);
            textureIdle = createVideoTexture(videoIdle);

            videoIdle.addEventListener('canplay', checkReady);
            videoIdle.addEventListener('playing', checkReady);

            // --- SETUP MUSIC (DISABLED) ---
            // Using Independent BackgroundMusic.js component

            // Create Teacher with Initial Texture (Idle)
            createTeacherVideoSprite();

            // Start Idle immediately
            videoIdle.play().then(() => {
                checkReady();
            }).catch(e => {
                console.log('Idle Autoplay blocked', e);
                // Even if blocked, try to show something
                checkReady();
            });

            onWindowResize();

            window.addEventListener('resize', onWindowResize, false);
            window.addEventListener('teacher-control', handleControlEvent);
            window.addEventListener('message', (e) => {
                try {
                    if (typeof e.data === 'string') {
                        const parsed = JSON.parse(e.data);
                        handleControlEvent({ detail: parsed });
                    }
                } catch (err) { }
            });

            document.getElementById('loader').style.display = 'none';
        }

        function createVideoElement(src, loop) {
            const vid = document.createElement('video');
            vid.src = src;
            vid.loop = loop;
            vid.muted = true;
            vid.playsInline = true;
            vid.crossOrigin = 'anonymous';
            vid.setAttribute('webkit-playsinline', 'true');
            vid.style.display = 'none';
            
            vid.onloadeddata = () => {
                console.log('Video Packed: ' + src);
                checkReady();
            };
            vid.onerror = (e) => sendMessage('LOG', 'Video Fail: ' + src);

            document.body.appendChild(vid);
            return vid;
        }

        function createVideoTexture(video) {
            const tex = new THREE.VideoTexture(video);
            tex.colorSpace = THREE.SRGBColorSpace;
            return tex;
        }

        let isReadySent = false;
        function checkReady() {
            if (isReadySent) return;
            // Force show if anything is ready or after timeout
            onWindowResize();
            sendMessage('READY', 'Teacher Loaded');
            isReadySent = true;
        }

        // Emergency timeout
        setTimeout(checkReady, 3000);

        function createBackground() {
            const loader = new THREE.TextureLoader();
            loader.load(BACKGROUND_IMAGE, (tex) => {
                tex.colorSpace = THREE.SRGBColorSpace;
                textures['bg'] = tex;
                
                const geometry = new THREE.PlaneGeometry(1, 1);
                const material = new THREE.MeshBasicMaterial({ map: tex, depthTest: false });
                backgroundMesh = new THREE.Mesh(geometry, material);
                backgroundMesh.position.set(0, 0, -5);
                backgroundMesh.renderOrder = -1;
                scene.add(backgroundMesh);
                
                onWindowResize();
                checkReady();
            }, undefined, () => {
                // Fallback background color if image fails
                scene.background = new THREE.Color(0xf0f0f0);
                checkReady();
            });
        }

        function createTeacherVideoSprite() {
            // Initial Texture: Idle
            const initialTexture = textureIdle;

            // Geometry: Widescreen (4.4 x 2.5) to match video aspect ratio and prevent thinning
            const geometry = new THREE.PlaneGeometry(4.4, 2.5);

            uniforms = {
                uTexture: { value: initialTexture },
                uTime: { value: 0 },
                uIsTalking: { value: 0.0 }
            };

            const material = new THREE.ShaderMaterial({
                uniforms: uniforms,
                transparent: true,
                side: THREE.DoubleSide,
                vertexShader: `
                    uniform float uTime;
                    uniform float uIsTalking;
                    varying vec2 vUv;

                    void main() {
                        vUv = uv; // Remove the 50% crop as it might be cutting the new video incorrectly
                        
                        vec3 pos = position;
                        gl_Position = projectionMatrix * modelViewMatrix * vec4(pos, 1.0);
                    }
                `,
                fragmentShader: `
                    uniform sampler2D uTexture;
                    varying vec2 vUv;

                    void main() {
                        vec4 color = texture2D(uTexture, vUv);
                        
                        // 1. GREEN SCREEN SMOOTH REMOVAL
                        float greenness = color.g - max(color.r, color.b);
                        float alphaG = 1.0 - smoothstep(0.05, 0.12, greenness);
                        
                        // 2. BLACK SCREEN SMOOTH REMOVAL
                        float brightness = max(max(color.r, color.g), color.b);
                        float alphaB = smoothstep(0.02, 0.15, brightness);
                        
                        // Combined Alpha
                        float alpha = min(alphaG, alphaB);

                        // 3. SPILL SUPPRESSION (Removes green/black edges)
                        if (greenness > 0.02) {
                            color.g = max(color.r, color.b); // Neutralize green spill
                        }
                        
                        // Neutralize dark edges
                        if (brightness < 0.2) {
                            color.rgb *= (alphaB * 1.5); // Brighten slightly near dark edges
                        }

                        gl_FragColor = vec4(color.rgb, alpha);
                        
                        // Essential for clipping
                        if (alpha < 0.05) discard;
                    }
                `
            });

            teacherMesh = new THREE.Mesh(geometry, material);
            teacherMesh.position.set(0.0, 0.1, 0); // Keep original pos
            scene.add(teacherMesh);

            // Shadow
            const shadow = new THREE.Mesh(
                new THREE.PlaneGeometry(1.0, 0.5),
                new THREE.MeshBasicMaterial({ color: 0x000000, transparent: true, opacity: 0.4 })
            );
            shadow.rotation.x = -Math.PI / 2;
            shadow.position.set(0.0, -1.1, 0);
            scene.add(shadow);
        }

        function handleControlEvent(e) {
            const data = e.detail;
            if (!data) return;
            console.log('🎮 [3D] Control Event:', data.type, data);
            switch (data.type) {
                case 'startTalking':
                    if (!isTalking) {
                        isTalking = true;
                        // Switch to Talking Video
                        videoIdle.pause();
                        uniforms.uTexture.value = textureTalking;
                        videoTalking.play().catch(e => console.log('Play error', e));
                    }
                    break;
                case 'stopTalking':
                    if (isTalking) {
                        isTalking = false;
                        // Switch to Idle Video
                        videoTalking.pause();
                        videoTalking.currentTime = 0; // Reset talking so it starts fresh next time?
                        uniforms.uTexture.value = textureIdle;
                        videoIdle.play().catch(e => console.log('Play error', e));
                    }
                    break;
                case 'walkToBoard': targetPosition.x = BOARD_X; break;
                case 'walkToLeft': targetPosition.x = -1.0; break; // Further left
                case 'walkToRight': targetPosition.x = 0.9; break; // Full Right visibility
                case 'walkToCenter': targetPosition.x = CENTER_X; break;
                case 'viseme': break;
                case 'playAnimation': break;
                case 'pauseMusic':
                    // Handled by BackgroundMusic.js component
                    break;
                case 'resumeMusic':
                    // Handled by BackgroundMusic.js component
                    if (isTalking && videoTalking) videoTalking.play();
                    else if (!isTalking && videoIdle) videoIdle.play();
                    break;
            }
        }

        function onWindowResize() {
            const width = window.innerWidth;
            const height = window.innerHeight;

            camera.aspect = width / height;
            camera.updateProjectionMatrix();
            renderer.setSize(width, height);

            if (backgroundMesh && textures['bg'] && textures['bg'].image) {
                backgroundMesh.scale.set(backgroundMesh.scale.x, backgroundMesh.scale.y, 1);
                // Background Cover Logic
                const imgAspect = textures['bg'].image.width / textures['bg'].image.height;
                const screenAspect = width / height;
                const dist = camera.position.z - backgroundMesh.position.z;
                const vFOV = THREE.MathUtils.degToRad(camera.fov);
                const visibleHeight = 2 * Math.tan(vFOV / 2) * dist;
                const visibleWidth = visibleHeight * camera.aspect;

                let scaleX = 1;
                let scaleY = 1;

                if (screenAspect > imgAspect) {
                    scaleX = visibleWidth;
                    scaleY = visibleWidth / imgAspect;
                    backgroundMesh.position.set(0, 0, -5); // Reset to center
                } else {
                    scaleY = visibleHeight;
                    scaleX = visibleHeight * imgAspect;

                    // FIX FOR MOBILE PORTRAIT: Align Blackboard
                    // The blackboard is on the RIGHT side of the image.
                    // In portrait, the image zooms in. We need to shift the image LEFT
                    // so the Right edge aligns with the Screen Right edge.

                    const shiftX = (scaleX - visibleWidth) / 2;
                    backgroundMesh.position.set(-shiftX, 0, -5);
                }
                backgroundMesh.scale.set(scaleX, scaleY, 1);
            }
        }

        function sendMessage(type, message) {
            const msg = JSON.stringify({ type, message });
            if (window.ReactNativeWebView) window.ReactNativeWebView.postMessage(msg);
            else if (window.parent) window.parent.postMessage(msg, '*');
        }

        function animate() {
            requestAnimationFrame(animate);
            const delta = clock.getDelta();
            const time = clock.getElapsedTime();

            if (teacherMesh && uniforms) {
                uniforms.uTime.value = time;
                uniforms.uIsTalking.value = isTalking ? 1.0 : 0.0;

                // --- MOVEMENT LOGIC (Walking) ---
                const dist = targetPosition.x - teacherMesh.position.x;
                const isWalking = Math.abs(dist) > 0.05;

                if (isWalking) {
                    // Move towards target
                    const dir = Math.sign(dist);
                    teacherMesh.position.x += dir * WALK_SPEED * delta;

                    // Prevent overshooting
                    if ((dir > 0 && teacherMesh.position.x > targetPosition.x) ||
                        (dir < 0 && teacherMesh.position.x < targetPosition.x)) {
                        teacherMesh.position.x = targetPosition.x;
                    }

                    // Walking Bounce (Much gentler now)
                    teacherMesh.position.y = 0.1 + Math.abs(Math.sin(time * 10.0)) * 0.02; // Reduced from 0.05

                    // Shadow follows
                    // Find shadow in scene
                    scene.traverse((child) => {
                        if (child.isMesh && child.geometry.type === 'PlaneGeometry' && child !== teacherMesh && child !== backgroundMesh) {
                            child.position.x = teacherMesh.position.x;
                        }
                    });

                } else {
                    // --- VIDEO ANIMATION LOGIC ---
                    // Just update time for shader breathing
                    // Video updates itself via VideoTexture.

                    // Note: VideoTexture handles the "talking" visual by simply playing.
                    // The shader adds the breath.
                }
            }

            renderer.render(scene, camera);
        }
    </script>
</body>

</html>
